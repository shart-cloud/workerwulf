apiVersion: apps/v1
kind: Deployment
metadata:
  name: wulf-local-operator
  namespace: wulf-system
  labels:
    app.kubernetes.io/name: wulf-local-operator
    app.kubernetes.io/part-of: wulf-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wulf-local-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wulf-local-operator
        app.kubernetes.io/part-of: wulf-local
    spec:
      serviceAccountName: wulf-local-operator
      containers:
        - name: manager
          image: ghcr.io/jlgore/wulf-local-operator:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --workerd-image=ghcr.io/jlgore/wulf-local-workerd:0.1.0
          ports:
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
