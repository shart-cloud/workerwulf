apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hardeningprofiles.wulf.jaredgore.com
spec:
  group: wulf.jaredgore.com
  scope: Namespaced
  names:
    plural: hardeningprofiles
    singular: hardeningprofile
    kind: HardeningProfile
    shortNames:
      - hp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                seccomp:
                  type: object
                  properties:
                    type:
                      type: string
                    profileRef:
                      type: string
                capabilitiesDrop:
                  type: array
                  items:
                    type: string
                capabilitiesAdd:
                  type: array
                  items:
                    type: string
                readOnlyRootFilesystem:
                  type: boolean
                runAsNonRoot:
                  type: boolean
                runAsUser:
                  type: integer
                  format: int64
                networkPolicyRef:
                  type: string
                tetragonPolicyRef:
                  type: string
      subresources:
        status: {}
