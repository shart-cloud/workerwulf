apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wulf-local-operator
rules:
  - apiGroups:
      - wulf.jaredgore.com
    resources:
      - sandboxworkers
      - hardeningprofiles
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - wulf.jaredgore.com
    resources:
      - sandboxworkers/status
      - hardeningprofiles/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - wulf.jaredgore.com
    resources:
      - sandboxworkers/finalizers
      - hardeningprofiles/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
