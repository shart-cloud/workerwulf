apiVersion: apps/v1
kind: Deployment
metadata:
  name: workerd-rt-001
  labels:
    app.kubernetes.io/name: workerd-rt-001
    app.kubernetes.io/part-of: wulf-local
    wulf.jaredgore.com/track: runtime-fingerprint
    wulf.jaredgore.com/probe-id: P-WL-RT-001
    wulf.jaredgore.com/hardening-profile: naked
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workerd-rt-001
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workerd-rt-001
        app.kubernetes.io/part-of: wulf-local
        wulf.jaredgore.com/track: runtime-fingerprint
        wulf.jaredgore.com/probe-id: P-WL-RT-001
        wulf.jaredgore.com/hardening-profile: naked
    spec:
      containers:
        - name: workerd
          image: ghcr.io/jlgore/wulf-local-workerd:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /etc/workerd/config/workerd.poc.capnp
            - -I
            - /usr/local/lib/node_modules/workerd
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: workerd-config
              mountPath: /etc/workerd
              readOnly: true
      volumes:
        - name: workerd-config
          configMap:
            name: workerd-rt-001-config
            items:
              - key: workerd.poc.capnp
                path: config/workerd.poc.capnp
              - key: rt-001-syscall-smoke.js
                path: probes/runtime/rt-001-syscall-smoke.js
