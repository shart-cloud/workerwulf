apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wulf-system

resources:
  - deploy/poc/namespace.yaml
  - deploy/poc/deployment.yaml
  - deploy/poc/service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: workerd-rt-001-config
    files:
      - workerd.poc.capnp=config/workerd.poc.capnp
      - rt-001-syscall-smoke.js=probes/runtime/rt-001-syscall-smoke.js
