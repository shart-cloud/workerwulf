apiVersion: wulf.jaredgore.com/v1alpha1
kind: SandboxWorker
metadata:
  name: workerd-rt-001
  namespace: wulf-system
  labels:
    wulf.jaredgore.com/track: runtime-fingerprint
    wulf.jaredgore.com/probe-id: P-WL-RT-001
spec:
  script:
    inline: |
      export default {
        fetch() {
          return Response.json({ ok: true, platform: "wulf-operator" });
        },
      };
  compatibilityDate: "2024-09-23"
  compatibilityFlags:
    - nodejs_compat
  bindings:
    vars:
      WORKER_NAME: workerd-rt-001
      HARDENING_PROFILE: naked
  hardening:
    profile: naked
  runtime:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  exposure:
    type: ClusterIP
    port: 8080
