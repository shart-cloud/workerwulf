apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hardeningprofiles.wulf.jaredgore.com
spec:
  group: wulf.jaredgore.com
  scope: Namespaced
  names:
    plural: hardeningprofiles
    singular: hardeningprofile
    kind: HardeningProfile
    shortNames:
      - hp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                seccomp:
                  type: object
                  properties:
                    type:
                      type: string
                    profileRef:
                      type: string
                capabilitiesDrop:
                  type: array
                  items:
                    type: string
                capabilitiesAdd:
                  type: array
                  items:
                    type: string
                allowPrivilegeEscalation:
                  type: boolean
                readOnlyRootFilesystem:
                  type: boolean
                runAsNonRoot:
                  type: boolean
                runAsUser:
                  type: integer
                  format: int64
                networkPolicyRef:
                  type: string
                tetragonPolicyRef:
                  type: string
                tetragonEnforceRef:
                  type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
