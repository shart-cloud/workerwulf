rules:
  # ── Callback / exfil URL targets ─────────────────────────────────────────
  - id: wulf-fetch-callback-host
    languages: [javascript, typescript]
    severity: ERROR
    message: "fetch() targets a WULF callback/exfil host (callback.wulf.shart.cloud or x.wulf.shart.cloud)."
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery"
      wulf_category: "callback_exfil"
    pattern-either:
      - patterns:
          - pattern: fetch("$URL", ...)
          - metavariable-regex:
              metavariable: $URL
              regex: '.*(callback\.wulf|x\.wulf|wulf\.shart\.cloud).*'
      - patterns:
          - pattern: fetch("$URL")
          - metavariable-regex:
              metavariable: $URL
              regex: '.*(callback\.wulf|x\.wulf|wulf\.shart\.cloud).*'
      - patterns:
          - pattern: fetch(`$URL`, ...)
          - metavariable-regex:
              metavariable: $URL
              regex: '.*(callback\.wulf|x\.wulf|wulf\.shart\.cloud).*'
      - patterns:
          - pattern: fetch(`$URL`)
          - metavariable-regex:
              metavariable: $URL
              regex: '.*(callback\.wulf|x\.wulf|wulf\.shart\.cloud).*'

  - id: wulf-fetch-exfil-path
    languages: [javascript, typescript]
    severity: ERROR
    message: "fetch() targets an /exfil/ path — likely data exfiltration."
    metadata:
      cwe: "CWE-200: Exposure of Sensitive Information"
      wulf_category: "callback_exfil"
    pattern-either:
      - patterns:
          - pattern: fetch("$URL", ...)
          - metavariable-regex:
              metavariable: $URL
              regex: '.*/exfil/.*'
      - patterns:
          - pattern: fetch("$URL")
          - metavariable-regex:
              metavariable: $URL
              regex: '.*/exfil/.*'

  # ── Dynamic code execution ───────────────────────────────────────────────
  - id: wulf-eval-reachable
    languages: [javascript, typescript]
    severity: ERROR
    message: "Dynamic code execution sink is reachable; avoid eval() and Function() in Worker code."
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      wulf_smell: eval-reachable
      family: B
      surfaces: [durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-DYN-01, W-DYN-02]
      severity_base: high
      substrate: ast
      precision_risk: low
      source: wulf-probe-finding
    pattern-either:
      - pattern: eval(...)
      - pattern: globalThis.eval(...)
      - pattern: window.eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)

  - id: wulf-dynamic-import-url
    languages: [javascript, typescript]
    severity: ERROR
    message: "Dynamic import specifier is influenced by request, environment, or storage data."
    metadata:
      cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      wulf_smell: dynamic-import-url
      family: B
      surfaces: [durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-DYN-03]
      severity_base: high
      substrate: ast-taint
      precision_risk: low
      source: cloudflare-best-practices
    pattern-either:
      - patterns:
          - pattern-inside: |
              const $SPEC = new URL($REQ.url).searchParams.get(...) ?? $FALLBACK;
              ...
          - pattern: import($SPEC)
      - patterns:
          - pattern-inside: |
              const $SPEC = env.$KEY;
              ...
          - pattern: import($SPEC)
      - patterns:
          - pattern-inside: |
              const $SPEC = await env.$NS.get(...);
              ...
          - pattern: import($SPEC)

  - id: wulf-wasm-from-bytes
    languages: [javascript, typescript]
    severity: WARNING
    message: "WebAssembly is compiled or instantiated from runtime-provided bytes; source-level scanners cannot inspect the payload."
    metadata:
      cwe: "CWE-506: Embedded Malicious Code"
      wulf_smell: wasm-from-bytes
      family: B
      surfaces: [durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-WASM-01]
      severity_base: medium
      substrate: ast-taint
      precision_risk: medium
      source: prd-family-b
    pattern-either:
      - patterns:
          - pattern-inside: |
              const $BYTES = await $REQ.arrayBuffer();
              ...
          - pattern: WebAssembly.compile($BYTES, ...)
      - patterns:
          - pattern-inside: |
              const $BYTES = await $REQ.arrayBuffer();
              ...
          - pattern: WebAssembly.instantiate($BYTES, ...)
      - patterns:
          - pattern-inside: |
              const $BYTES = env.$KEY;
              ...
          - pattern: WebAssembly.compile($BYTES, ...)
      - patterns:
          - pattern-inside: |
              const $BYTES = env.$KEY;
              ...
          - pattern: WebAssembly.instantiate($BYTES, ...)
      - patterns:
          - pattern-inside: |
              const $BYTES = await env.$NS.get(...);
              ...
          - pattern: WebAssembly.compile($BYTES, ...)
      - patterns:
          - pattern-inside: |
              const $BYTES = await env.$NS.get(...);
              ...
          - pattern: WebAssembly.instantiate($BYTES, ...)

  - id: wulf-decode-then-execute
    languages: [javascript, typescript]
    severity: ERROR
    message: "Decoded string flows into dynamic code execution; this is a common obfuscation path for generated or injected payloads."
    metadata:
      cwe: "CWE-506: Embedded Malicious Code"
      wulf_smell: decode-then-execute
      family: B
      surfaces: [durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [AI-INJ-09, W-DYN-01, W-DYN-02]
      severity_base: high
      substrate: ast-taint
      precision_risk: medium
      source: wulf-probe-finding
    pattern-either:
      - patterns:
          - pattern-inside: |
              const $CODE = atob(...);
              ...
          - pattern: eval($CODE)
      - patterns:
          - pattern-inside: |
              const $CODE = atob(...);
              ...
          - pattern: globalThis.eval($CODE)
      - patterns:
          - pattern-inside: |
              const $CODE = atob(...);
              ...
          - pattern: new Function($CODE)
      - pattern: eval(atob(...))
      - pattern: globalThis.eval(atob(...))
      - pattern: new Function(atob(...))

  # ── Binding / env enumeration ────────────────────────────────────────────
  - id: wulf-env-enumeration
    languages: [javascript, typescript]
    severity: WARNING
    message: "Iterating over env bindings — likely capability enumeration."
    metadata:
      cwe: "CWE-200"
      wulf_category: "binding_enum"
    pattern-either:
      - pattern: Object.keys(env)
      - pattern: Object.entries(env)
      - pattern: Object.values(env)
      - pattern: Reflect.ownKeys(env)
      - pattern: for (const $X in env) { ... }
      - pattern: for (const $X of Object.keys(env)) { ... }

  # ── Prototype pollution ─────────────────────────────────────────────────
  - id: wulf-prototype-pollution
    languages: [javascript, typescript]
    severity: ERROR
    message: "Prototype or runtime intrinsic is monkey-patched; mutation can persist across requests in reused isolates."
    metadata:
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes"
      wulf_smell: prototype-pollution
      family: C
      surfaces: [worker, dynamic, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-RUN-05, W-RUN-06]
      severity_base: high
      substrate: ast
      precision_risk: low
      source: wulf-probe-finding
    pattern-either:
      - pattern: Object.prototype.$X = $Y
      - pattern: $OBJ.__proto__ = $Y
      - pattern: $OBJ["__proto__"] = $Y
      - pattern: $OBJ.__proto__.$X = $Y
      - pattern: globalThis.fetch = $Y
      - pattern: globalThis.crypto = $Y
      - pattern: Array.prototype.$METHOD = $Y
      - pattern: Response.prototype.$METHOD = $Y
      - pattern: Request.prototype.$METHOD = $Y

  # ── Base64 decode + fetch pattern (matches evade-b64-url) ────────────────
  - id: wulf-b64-decode-fetch
    languages: [javascript, typescript]
    severity: WARNING
    message: "Base64 decode flowing into fetch() — runtime-constructed URL, common exfil obfuscation."
    metadata:
      cwe: "CWE-506: Embedded Malicious Code"
      wulf_category: "obfuscation"
    pattern-either:
      - patterns:
          - pattern: |
              $URL = atob(...)
              ...
              fetch($URL, ...)
      - patterns:
          - pattern: fetch(atob(...), ...)
      - patterns:
          - pattern: fetch(atob(...))

  # ── Reading callback URL from env then fetching (matches evade-indirect) ──
  - id: wulf-env-callback-fetch
    languages: [javascript, typescript]
    severity: WARNING
    message: "Reading WULF_CALLBACK env var and using it in fetch() — indirect exfil."
    metadata:
      cwe: "CWE-918"
      wulf_category: "callback_exfil_indirect"
    pattern-either:
      - patterns:
          - pattern: |
              $URL = env.WULF_CALLBACK_HTTP_BASE
              ...
              fetch($URL + $PATH, ...)
      - patterns:
          - pattern: fetch(env.WULF_CALLBACK_HTTP_BASE + $X, ...)
      - patterns:
          - pattern: fetch(`${env.WULF_CALLBACK_HTTP_BASE}$X`, ...)

  # ── Secrets & credentials ────────────────────────────────────────────────
  - id: wulf-secret-in-logs
    languages: [javascript, typescript]
    severity: WARNING
    message: "Secret-like value is written to console logs; logs are a durable out-of-band exposure path."
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      wulf_smell: secret-in-logs
      family: A
      surfaces: [worker, durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [DO-MON-02, worker-logging-probe-pending, P-OBS-01-pending]
      severity_base: medium
      substrate: ast
      precision_risk: medium
      source: wulf-probe-finding
    pattern-either:
      - pattern: console.log(env.$KEY, ...)
      - pattern: console.warn(env.$KEY, ...)
      - pattern: console.error(env.$KEY, ...)
      - pattern: console.log(..., env.$KEY, ...)
      - pattern: console.warn(..., env.$KEY, ...)
      - pattern: console.error(..., env.$KEY, ...)
      - pattern: console.log(JSON.stringify(env), ...)
      - pattern: console.warn(JSON.stringify(env), ...)
      - pattern: console.error(JSON.stringify(env), ...)
      - pattern: logger.info(JSON.stringify(env), ...)
      - pattern: logger.warn(JSON.stringify(env), ...)
      - pattern: logger.error(JSON.stringify(env), ...)
      - pattern: logger.debug(JSON.stringify(env), ...)
      - pattern: log.info(JSON.stringify(env), ...)
      - pattern: log.warn(JSON.stringify(env), ...)
      - pattern: log.error(JSON.stringify(env), ...)
      - pattern: log.debug(JSON.stringify(env), ...)
      - patterns:
          - pattern-inside: |
              const $SECRETS = env;
              ...
          - pattern: console.log(JSON.stringify($SECRETS), ...)
      - patterns:
          - pattern-inside: |
              const $SECRETS = env;
              ...
          - pattern: console.warn(JSON.stringify($SECRETS), ...)
      - patterns:
          - pattern-inside: |
              const $SECRETS = env;
              ...
          - pattern: console.error(JSON.stringify($SECRETS), ...)
      - pattern: console.log(token, ...)
      - pattern: console.warn(token, ...)
      - pattern: console.error(token, ...)
      - pattern: console.log(..., token, ...)
      - pattern: console.warn(..., token, ...)
      - pattern: console.error(..., token, ...)
      - pattern: console.log({ token }, ...)
      - pattern: console.warn({ token }, ...)
      - pattern: console.error({ token }, ...)
      - pattern: 'console.log({ token: $VALUE }, ...)'
      - pattern: 'console.warn({ token: $VALUE }, ...)'
      - pattern: 'console.error({ token: $VALUE }, ...)'
      - pattern: logger.info(token, ...)
      - pattern: logger.warn(token, ...)
      - pattern: logger.error(token, ...)
      - pattern: logger.debug(token, ...)
      - pattern: logger.info(..., token, ...)
      - pattern: logger.warn(..., token, ...)
      - pattern: logger.error(..., token, ...)
      - pattern: logger.debug(..., token, ...)
      - pattern: logger.info({ token }, ...)
      - pattern: logger.warn({ token }, ...)
      - pattern: logger.error({ token }, ...)
      - pattern: logger.debug({ token }, ...)
      - pattern: 'logger.info({ token: $VALUE }, ...)'
      - pattern: 'logger.warn({ token: $VALUE }, ...)'
      - pattern: 'logger.error({ token: $VALUE }, ...)'
      - pattern: 'logger.debug({ token: $VALUE }, ...)'
      - pattern: log.info(token, ...)
      - pattern: log.warn(token, ...)
      - pattern: log.error(token, ...)
      - pattern: log.debug(token, ...)
      - pattern: log.info(..., token, ...)
      - pattern: log.warn(..., token, ...)
      - pattern: log.error(..., token, ...)
      - pattern: log.debug(..., token, ...)
      - pattern: log.info({ token }, ...)
      - pattern: log.warn({ token }, ...)
      - pattern: log.error({ token }, ...)
      - pattern: log.debug({ token }, ...)
      - pattern: 'log.info({ token: $VALUE }, ...)'
      - pattern: 'log.warn({ token: $VALUE }, ...)'
      - pattern: 'log.error({ token: $VALUE }, ...)'
      - pattern: 'log.debug({ token: $VALUE }, ...)'
      - pattern: console.log(secret, ...)
      - pattern: console.warn(secret, ...)
      - pattern: console.error(secret, ...)
      - pattern: console.log(..., secret, ...)
      - pattern: console.warn(..., secret, ...)
      - pattern: console.error(..., secret, ...)
      - pattern: console.log({ secret }, ...)
      - pattern: console.warn({ secret }, ...)
      - pattern: console.error({ secret }, ...)
      - pattern: 'console.log({ secret: $VALUE }, ...)'
      - pattern: 'console.warn({ secret: $VALUE }, ...)'
      - pattern: 'console.error({ secret: $VALUE }, ...)'
      - pattern: console.log(password, ...)
      - pattern: console.warn(password, ...)
      - pattern: console.error(password, ...)
      - pattern: console.log(..., password, ...)
      - pattern: console.warn(..., password, ...)
      - pattern: console.error(..., password, ...)
      - pattern: console.log({ password }, ...)
      - pattern: console.warn({ password }, ...)
      - pattern: console.error({ password }, ...)
      - pattern: 'console.log({ password: $VALUE }, ...)'
      - pattern: 'console.warn({ password: $VALUE }, ...)'
      - pattern: 'console.error({ password: $VALUE }, ...)'
      - pattern: console.log(apiKey, ...)
      - pattern: console.warn(apiKey, ...)
      - pattern: console.error(apiKey, ...)
      - pattern: console.log(..., apiKey, ...)
      - pattern: console.warn(..., apiKey, ...)
      - pattern: console.error(..., apiKey, ...)
      - pattern: console.log({ apiKey }, ...)
      - pattern: console.warn({ apiKey }, ...)
      - pattern: console.error({ apiKey }, ...)
      - pattern: 'console.log({ apiKey: $VALUE }, ...)'
      - pattern: 'console.warn({ apiKey: $VALUE }, ...)'
      - pattern: 'console.error({ apiKey: $VALUE }, ...)'
      - pattern: console.log(authorization, ...)
      - pattern: console.warn(authorization, ...)
      - pattern: console.error(authorization, ...)
      - pattern: console.log(..., authorization, ...)
      - pattern: console.warn(..., authorization, ...)
      - pattern: console.error(..., authorization, ...)
      - pattern: console.log({ authorization }, ...)
      - pattern: console.warn({ authorization }, ...)
      - pattern: console.error({ authorization }, ...)
      - pattern: 'console.log({ authorization: $VALUE }, ...)'
      - pattern: 'console.warn({ authorization: $VALUE }, ...)'
      - pattern: 'console.error({ authorization: $VALUE }, ...)'
      - pattern: console.log(cookie, ...)
      - pattern: console.warn(cookie, ...)
      - pattern: console.error(cookie, ...)
      - pattern: console.log(..., cookie, ...)
      - pattern: console.warn(..., cookie, ...)
      - pattern: console.error(..., cookie, ...)
      - pattern: console.log({ cookie }, ...)
      - pattern: console.warn({ cookie }, ...)
      - pattern: console.error({ cookie }, ...)
      - pattern: 'console.log({ cookie: $VALUE }, ...)'
      - pattern: 'console.warn({ cookie: $VALUE }, ...)'
      - pattern: 'console.error({ cookie: $VALUE }, ...)'

  - id: wulf-secret-in-source
    languages: [javascript, typescript]
    severity: ERROR
    message: "Secret-like literal is hardcoded in source; move credentials to Worker secrets or environment bindings."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      wulf_smell: secret-in-source
      family: A
      surfaces: [worker, durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-ENV-02]
      severity_base: high
      substrate: ast
      precision_risk: medium
      source: prd-family-a
    pattern-either:
      - pattern: const token = "$VALUE"
      - pattern: let token = "$VALUE"
      - pattern: var token = "$VALUE"
      - pattern: const secret = "$VALUE"
      - pattern: let secret = "$VALUE"
      - pattern: var secret = "$VALUE"
      - pattern: const password = "$VALUE"
      - pattern: let password = "$VALUE"
      - pattern: var password = "$VALUE"
      - pattern: const apiKey = "$VALUE"
      - pattern: let apiKey = "$VALUE"
      - pattern: var apiKey = "$VALUE"
      - pattern: const privateKey = "$VALUE"
      - pattern: let privateKey = "$VALUE"
      - pattern: var privateKey = "$VALUE"
      - pattern: const bearer = "$VALUE"
      - pattern: let bearer = "$VALUE"
      - pattern: var bearer = "$VALUE"
      - pattern: 'token: "$VALUE"'
      - pattern: 'secret: "$VALUE"'
      - pattern: 'password: "$VALUE"'
      - pattern: 'apiKey: "$VALUE"'
      - pattern: 'privateKey: "$VALUE"'
      - pattern: 'bearer: "$VALUE"'

  - id: wulf-secret-in-wrangler-vars
    languages: [generic]
    severity: ERROR
    message: "Secret-like literal appears in Wrangler vars; use `wrangler secret` instead of committing credentials to config."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      wulf_smell: secret-in-source
      family: A
      surfaces: [worker, durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-ENV-02]
      severity_base: high
      substrate: config-lint
      precision_risk: medium
      source: cloudflare-best-practices
    paths:
      include:
        - "*wrangler*.toml"
        - "**/*wrangler*.toml"
    patterns:
      - pattern-regex: '(?im)^\s*[A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD|API_KEY|PRIVATE_KEY|BEARER)[A-Z0-9_]*\s*=\s*".{6,}"'
      - pattern-not-regex: '(?im)^\s*[A-Z0-9_]*(?:FIELD|NAME|EXAMPLE)[A-Z0-9_]*\s*=\s*"(?:password|secret|token|apiKey|example)"'

  - id: wulf-hardcoded-conn-string
    languages: [javascript, typescript]
    severity: ERROR
    message: "Hardcoded database/cache connection string with inline credentials; use Worker secrets, Hyperdrive, or environment bindings."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      wulf_smell: hardcoded-connection-string
      family: A
      surfaces: [worker, durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-ENV-02]
      severity_base: high
      substrate: ast
      precision_risk: low
      source: cloudflare-best-practices
    patterns:
      - pattern-regex: '"(?:postgres(?:ql)?|mysql)://[^"\s:@]+:[^"\s@]+@[^"\s]+"|"redis://:[^"\s@]+@[^"\s]+"'
      - pattern-not-regex: '"(?:postgres(?:ql)?|mysql)://user:pass@example\.com/[^"\s]+"'

  - id: wulf-cf-api-token-in-worker
    languages: [javascript, typescript]
    severity: ERROR
    message: "Worker code calls the Cloudflare API with a bearer API token; prefer narrower bindings or split control-plane credentials out of request-facing code."
    metadata:
      cwe: "CWE-522: Insufficiently Protected Credentials"
      wulf_smell: cf-api-token-in-worker
      family: A
      surfaces: [worker, durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-BND-01]
      severity_base: high
      substrate: ast
      precision_risk: low
      source: wulf-probe-finding
    pattern-either:
      - patterns:
          - pattern: 'fetch($URL, { headers: { Authorization: `Bearer ${env.CF_API_TOKEN}`, ... }, ... })'
          - metavariable-regex:
              metavariable: $URL
              regex: '^"https://api\.cloudflare\.com/'
      - patterns:
          - pattern-inside: |
              const $URL = $CF_URL;
              ...
          - pattern: 'fetch($URL, { headers: { Authorization: `Bearer ${env.CF_API_TOKEN}`, ... }, ... })'
          - metavariable-regex:
              metavariable: $CF_URL
              regex: '^"https://api\.cloudflare\.com/'
      - patterns:
          - pattern: 'fetch($URL, { headers: { Authorization: "Bearer " + env.CF_API_TOKEN, ... }, ... })'
          - metavariable-regex:
              metavariable: $URL
              regex: '^"https://api\.cloudflare\.com/'
      - patterns:
          - pattern-inside: |
              const $URL = $CF_URL;
              ...
          - pattern: 'fetch($URL, { headers: { Authorization: "Bearer " + env.CF_API_TOKEN, ... }, ... })'
          - metavariable-regex:
              metavariable: $CF_URL
              regex: '^"https://api\.cloudflare\.com/'
      - patterns:
          - pattern-inside: |
              const $TOKEN = env.CF_API_TOKEN;
              ...
          - pattern: 'fetch($URL, { headers: { Authorization: `Bearer ${$TOKEN}`, ... }, ... })'
          - metavariable-regex:
              metavariable: $URL
              regex: '^"https://api\.cloudflare\.com/'
      - patterns:
          - pattern-inside: |
              const $URL = $CF_URL;
              ...
          - pattern-inside: |
              const $TOKEN = env.CF_API_TOKEN;
              ...
          - pattern: 'fetch($URL, { headers: { Authorization: `Bearer ${$TOKEN}`, ... }, ... })'
          - metavariable-regex:
              metavariable: $CF_URL
              regex: '^"https://api\.cloudflare\.com/'
      - patterns:
          - pattern-inside: |
              const $TOKEN = env.CF_API_TOKEN;
              ...
          - pattern: 'fetch($URL, { headers: { Authorization: "Bearer " + $TOKEN, ... }, ... })'
          - metavariable-regex:
              metavariable: $URL
              regex: '^"https://api\.cloudflare\.com/'
      - patterns:
          - pattern-inside: |
              const $URL = $CF_URL;
              ...
          - pattern-inside: |
              const $TOKEN = env.CF_API_TOKEN;
              ...
          - pattern: 'fetch($URL, { headers: { Authorization: "Bearer " + $TOKEN, ... }, ... })'
          - metavariable-regex:
              metavariable: $CF_URL
              regex: '^"https://api\.cloudflare\.com/'

  # ── Crypto & comparison ──────────────────────────────────────────────────
  - id: wulf-insecure-random
    languages: [javascript, typescript]
    severity: ERROR
    message: "Math.random() is used to generate a security-sensitive value; use crypto.getRandomValues() instead."
    metadata:
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"
      wulf_smell: insecure-random
      family: D
      surfaces: [worker, durable, dynamic, ai, platform]
      trust_context: [first-party, loaded-untrusted, ai-generated, multi-tenant]
      validated_by: [W-CRY-03]
      severity_base: high
      substrate: ast
      precision_risk: medium
      source: cloudflare-best-practices
    pattern-either:
      - patterns:
          - pattern: const $NAME = Math.random(...)
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(token|secret|key|nonce|session|csrf|auth|password|signature|hmac|id).*'
      - patterns:
          - pattern: const $NAME = Math.random(...).$METHOD(...)
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(token|secret|key|nonce|session|csrf|auth|password|signature|hmac|id).*'
      - patterns:
          - pattern: const $NAME = Math.random(...).$METHOD(...).$METHOD2(...)
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(token|secret|key|nonce|session|csrf|auth|password|signature|hmac|id).*'
      - patterns:
          - pattern: let $NAME = Math.random(...)
          - metavariable-regex:
              metavariable: $NAME
              regex: '(?i).*(token|secret|key|nonce|session|csrf|auth|password|signature|hmac|id).*'
      - patterns:
          - pattern: var $NAME = Math.random(...)
          - metavariable-regex:
              metavariable: $NAME
