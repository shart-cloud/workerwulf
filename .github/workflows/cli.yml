name: CLI

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/analyze/**"
      - "packages/analyze-poc/**"
      - "packages/hub/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/analyze/**"
      - "packages/analyze-poc/**"
      - "packages/hub/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/cli.yml"

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24] # 20 = the engines floor declared in package.json (oxc-parser needs ^20.19 || >=22.12)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from the root packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (cli, analyze, core + their deps only)
        run: pnpm install --frozen-lockfile --filter @wulf/cli... --filter @wulf/analyze... --filter @wulf/core...

      - name: Typecheck
        run: pnpm --filter @wulf/core --filter @wulf/analyze --filter @wulf/cli typecheck

      - name: Test
        run: pnpm --filter @wulf/core --filter @wulf/analyze --filter @wulf/cli test

  workerd:
    # The rule engine inside workerd (wrangler dev) must match the CLI byte for byte.
    name: workerd equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (analyze-poc + its deps, including the CLI it compares against)
        run: pnpm install --frozen-lockfile --filter @wulf/analyze-poc...

      - name: Typecheck
        run: pnpm --filter @wulf/analyze-poc typecheck

      - name: Bundle size (budget 3 MB gzipped)
        working-directory: packages/analyze-poc
        run: |
          pnpm exec wrangler deploy --dry-run --outdir dist | tee bundle.txt
          gzip_kib=$(grep -o 'gzip: [0-9.]* KiB' bundle.txt | grep -o '[0-9.]*')
          echo "gzip: ${gzip_kib} KiB"
          awk -v k="$gzip_kib" 'BEGIN { exit !(k < 3072) }'

      - name: Test (starts wrangler dev)
        run: pnpm --filter @wulf/analyze-poc test

  hub:
    # ScanHub + ScanWorkflow in workerd (@cloudflare/vitest-plugin): lifecycle,
    # equivalence with in-memory analysis, and the no-secrets sentinel.
    name: hub (workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (hub + its deps)
        run: pnpm install --frozen-lockfile --filter @wulf/hub...

      - name: Typecheck
        run: pnpm --filter @wulf/hub typecheck

      - name: Bundle size (budget 3 MB gzipped)
        working-directory: packages/hub
        run: |
          pnpm exec wrangler deploy --dry-run --outdir dist | tee bundle.txt
          gzip_kib=$(grep -o 'gzip: [0-9.]* KiB' bundle.txt | grep -o '[0-9.]*')
          echo "gzip: ${gzip_kib} KiB"
          awk -v k="$gzip_kib" 'BEGIN { exit !(k < 3072) }'

      - name: Test
        run: pnpm --filter @wulf/hub test

  build:
    name: build & smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (cli + its deps only)
        run: pnpm install --frozen-lockfile --filter @wulf/cli...

      - name: Build
        run: pnpm --filter @wulf/cli build

      - name: Smoke-test the built binary
        working-directory: packages/cli
        run: |
          node dist/index.js --version
          # Clean fixture must pass --strict — this is the green CI path the tool promises.
          node dist/index.js audit test/fixtures/clean --source --strict
          # Coverage matrix doubles as a traceability gate: exits 1 if any rule lacks a probe (§14).
          node dist/index.js report --matrix --include-probes test/fixtures/probes > /dev/null
          # Publish tarball must contain only dist/ + README.
          npm pack --dry-run

      - name: Upload built CLI
        uses: actions/upload-artifact@v4
        with:
          name: wulf-cli-dist
          path: packages/cli/dist/
          if-no-files-found: error
