name = "rules-bad"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[[kv_namespaces]]
binding = "DATA_KV"
id = "kv-1"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bucket-1"

[[d1_databases]]
binding = "DB"
database_id = "db-1"

[[services]]
binding = "INTERNAL"
service = "internal-worker"

[[secrets_store_secrets]]
binding = "API_SECRET"
store_id = "store-1"
secret_name = "api-secret"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[queues.producers]]
binding = "TASKS"
queue = "tasks"
