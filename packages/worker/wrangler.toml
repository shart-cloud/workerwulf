name = "wulf-worker"
main = "src/index.ts"
account_id = "11caecd272df7dbdcc636034c25b1f1c"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Track 1 bindings — point at the Terraform-managed resources.
# IDs come from `terraform -chdir=infra output`.

[[kv_namespaces]]
binding = "PREY_KV"
id = "d300472e3aa9468395a26b8065636681"

[[r2_buckets]]
binding = "PREY_R2"
bucket_name = "wulf-research-findings"

[[r2_buckets]]
binding = "LOGPUSH_R2"
bucket_name = "cloudflare-managed-523ab9fc"

[[d1_databases]]
binding = "PREY_D1"
database_name = "wulf-d1"
database_id = "5f3d553e-4e2e-44a4-b1b7-2202a33cda3d"

# Service bindings for W-SVC probes
[[services]]
binding = "SVC_SELF"
service = "wulf-worker"

[[services]]
binding = "SVC_RELAY"
service = "wulf-dynamic-parent"

# --- Wave 5: Workers Cache (ctx.cache) — W-WC-* probes (docs/wave5-workers-cache.md) ---
# Loopback self-binding to the deliberately-vulnerable cached WcVictim entrypoint.
# Lets a probe in the default (uncached) /probe/* router drive attacker->victim
# sequences through the edge cache — per the docs, a service-binding fetch to the
# callee entrypoint consults that entrypoint's cache.
[[services]]
binding = "SVC_WC_VICTIM"
service = "wulf-worker"
entrypoint = "WcVictim"

# Enable Workers Cache on the WcVictim entrypoint ONLY so the /probe/* router stays
# uncached and the 60+ existing Track-1 probes keep their determinism (threat-model
# T4). Syntax verified against wrangler 4.108.0's config-schema.json: `cache` is a
# top-level table requiring `enabled`; `exports` is a MAP keyed by export name whose
# WorkerEntrypointExport entries require `type = "worker"` (it is NOT an
# `[[exports]]` array with a `name` key).
[cache]
enabled = false                # default entrypoint (the /probe/* router) is NOT cached
cross_version_cache = false    # never reuse cached entries across Worker versions

[exports.WcVictim]
type = "worker"
cache = { enabled = true }     # cache this entrypoint's GET/HEAD responses

# Capability-binding probe W-CAP-01. Uncomment and set id to the
# `hyperdrive_id` Terraform output after `terraform apply` (see
# docs/wave2-hyperdrive.md). Left commented so local dev / deploy work
# before the Hyperdrive resource exists.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "ed30b8cf19bf4bd390cc4f7cb6ad8604"   # wulf-hyperdrive -> VPC svc 019f3e90 -> wulf-vpc tunnel -> wulf-pg

# Capability-binding probe W-CAP-04 (Vectorize / RAG poisoning). Create the
# index first: wrangler vectorize create wulf-embeddings --dimensions=768
# --metric=cosine. See docs/wave3-capability-bindings.md.
[[vectorize]]
binding = "VECTORIZE"
index_name = "wulf-embeddings"

# Capability-binding probe W-CAP-05 (Browser Rendering / SSRF-with-a-browser).
# Account-level binding; no resource to create. See docs/wave3-capability-bindings.md.
[browser]
binding = "BROWSER"

# Capability-binding probe W-CAP-03 (send_email). destination_address PINS
# delivery to one verified researcher-owned address (the safeguard). Also set
# WULF_EMAIL_FROM (verified domain) + WULF_EMAIL_TO (= destination_address) in
# [vars]. See docs/wave3-capability-bindings.md.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "gore.jared@gmail.com"   # pins delivery to the researcher's own inbox (safeguard)

# --- Wave 4 capability-binding probes (see docs/wave4-capability-bindings.md) ---

# W-CAP-02 (Secrets Store). Create the store + secret first, e.g.:
#   wrangler secrets-store store create wulf-secrets
#   wrangler secrets-store secret create wulf-secrets --name WULF_CANARY \
#     --value 'flag{w-cap-02-secrets-store-canary}' --scopes workers
# Then set store_id/secret_name to the created resource.
[[secrets_store_secrets]]
binding = "SECRET"
store_id = "7050b29b966246fa8d5620b195bb9c8b"   # default_secrets_store
secret_name = "WULF_CANARY"

# W-CAP-06 (Queues producer). Create the queue first:
#   wrangler queues create wulf-prey-queue
[[queues.producers]]
binding = "PREY_QUEUE"
queue = "wulf-prey-queue"

# W-CAP-07 (mTLS client certificate). Upload the cert first:
#   wrangler mtls-certificate upload --cert cert.pem --key key.pem --name wulf-mtls
# Set certificate_id to the returned id.
[[mtls_certificates]]
binding = "MTLS_FETCHER"
certificate_id = "52a8fbc3-4878-4979-88a1-8e0074620154"   # wulf-mtls-badssl (badssl.com public client cert)

# W-CAP-08 (Workers Analytics Engine). No resource to create; the dataset is
# named inline and created on first write.
[[analytics_engine_datasets]]
binding = "AE"
dataset = "wulf_cap08"

# W-CAP-09 (Workers AI). Account-level binding; no resource to create.
[ai]
binding = "AI"

[vars]
WULF_ENV_PROBE = "from-wrangler-toml"
WULF_CALLBACK_HTTP_BASE = "http://callback.wulf.shart.cloud"
WULF_DNS_EXFIL_ZONE = "x.wulf.shart.cloud"
# W-CAP-03 (send_email). FROM on the Email-Sending-onboarded domain; TO pinned
# to the binding's destination_address.
WULF_EMAIL_FROM = "wulf@shart.cloud"
WULF_EMAIL_TO = "gore.jared@gmail.com"

# Real secrets go via `wrangler secret put` or .dev.vars (gitignored).
