name = "wulf-outbound"
main = "src/outbound.ts"
account_id = "11caecd272df7dbdcc636034c25b1f1c"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[r2_buckets]]
binding = "OUTBOUND_LOG"
bucket_name = "wulf-outbound-log"

[vars]
# x.wulf.shart.cloud is the DNS-exfil zone (any subdomain resolves to the callbackd
# droplet). Allowlisting it lets P-CAP-03 reach a logging upstream WITHOUT un-blocking
# callback.wulf.shart.cloud, which the P-OUT-* exfil-control probes rely on staying denied.
WULF_OUTBOUND_ALLOWLIST = "cloudflare.com,workers.dev,x.wulf.shart.cloud"
WULF_OUTBOUND_AUTH_TOKEN = "wulf-outbound-injected-canary"
